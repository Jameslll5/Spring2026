<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Why I do sports photography</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: darkorange;
            color: #fff;
            font-size: 1.2rem;
            font-family: 'Oswald', sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        h1 { color: red; text-align: center; font-weight: bold; font-size: clamp(1.5rem, 5vw, 3rem); background-color: white; padding: 5px; border-radius: 20px; }
        .flex-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 20px;
            width: 90%;
            max-width: 1600px;
            margin: 40px auto 0;
            background: rgba(255,140,0,0.8);
            border-radius: 8px;
        }
        .flex-container img {
            width: clamp(150px, 45vw, 700px);
            height: clamp(150px, 45vw, 700px);
            object-fit: cover;
            border: 2px solid #fff;
            border-radius: 4px;
        }
        .focus-football {
            object-position: top center;
        }
        @media (max-width: 768px) {
            body { padding: 10px; }
            .flex-container img { width: clamp(100px, 40vw, 300px); height: clamp(100px, 40vw, 300px); }
        }
        @media (max-width: 480px) {
            .flex-container img { width: 100%; height: 200px; }
        }
    </style>
</head>
<body>
    <h1>Why I like to do Sports Photography</h1>
    <p style="background-color: black; color: white; padding: 10px; border-radius: 10px;">I like to do sports photography because I enjoy capturing awesome action shots—like a football tackle, a player running, or throwing the ball. I do this by providing good quality pictures that show the excitement of the game.</p>
    <div class="flex-container">
        <img class="focus-football" src="sports photos/1000013322.jpg" alt="picture of a football player" />
        <img src="sports photos/1000013329.jpg" alt="soccer player" />
        <img src="sports photos/1000013326.jpg" alt="volleyball player" />
        <img src="sports photos/1000013332.jpg" alt="2 softball players" />
    </div>
</body>
</html>
