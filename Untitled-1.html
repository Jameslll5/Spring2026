<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Why I do sports photography</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <style>
        body { background-color: red; color: #fff; font-size: 1.2rem; font-family: 'Oswald', sans-serif; }
        h1 { color: lightblue; text-align: center; font-weight: bold; font-size: 3rem; }
        .flex-container {
            display: flex;
            flex-wrap: wrap;          
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 40px;
            
            width: 460px; 
            margin: 0 auto; 
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,0,0,0.8); 
        }
        .flex-container img {
            width: 200px;
            height: 200px;          
            object-fit: cover;      
            border: 2px solid #fff;
            border-radius: 4px;
        }
        
        .focus-football {
            object-position: top center; 
        }
    </style>
</head>
<body>
    <h1>Why I like to do Sports Photography</h1>
    <p>I like to do sports photography because I enjoy capturing awesome action shots—like a football tackle, a player running, or throwing the ball. I do this by providing good quality pictures that show the excitement of the game.</p>
    <div class="flex-container">
        <img class="focus-football" src="sports photos/1000013322.jpg" alt="picture of a football player" />
        <img src="sports photos/1000013329.jpg" alt="soccer player" />
        <img src="sports photos/1000013326.jpg" alt="volleyball player" />
        <img src="sports photos/1000013332.jpg" alt="2 softball players" />
    </div>
</body>
</html>
