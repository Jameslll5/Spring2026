        <meta charset="utf-8">

    <body>
        <!--[if lt IE 7]>

        <div class="hero">
            <h1>Book your sports game or photoshoot now</h1>

            <form class="contact-form" action="#" method="post">
                <label for="first-name">First name</label>
                <input type="text" id="first-name" name="first_name" required>

                <label for="last-name">Last name</label>
                <input type="text" id="last-name" name="last_name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="phone">Phone number</label>
                <input type="tel" id="phone" name="phone" required>

                <label for="message">Write your details</label>
                <textarea id="message" name="message" rows="6" placeholder="Describe the session, date, location, or questions..."></textarea>

                <button type="submit">Send</button>
            </form>
        </div>

        <svg class="camera-svg" viewBox="0 0 64 64" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
            <rect x="6" y="18" width="52" height="34" rx="4" fill="white" />
            <rect x="10" y="12" width="14" height="8" rx="2" fill="white" />
            <circle cx="32" cy="35" r="10" fill="none" stroke="#000" stroke-width="3" />
            <circle cx="32" cy="35" r="6" fill="#000" />
            <rect x="46" y="22" width="6" height="6" rx="1" fill="#000" opacity="0.08" />
        </svg>

        <audio class="camera-audio" controls>
            <source src="audio/kakaist-camera-shutter-314056.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>

        <script src="" async defer></script>
    </body>
