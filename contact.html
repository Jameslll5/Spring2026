<html></html>
  <head>
    <title>Book your sports game & Photoshoot now</title>
    <link rel="stylesheet" type="text/css" href="style.css">
  </head>
  <body>
    <div class="container">
      <h1>Book your sports game & Photoshoot now</h1>
      <audio controls style="position: fixed; bottom: 20px; left: 20px; z-index: 9998;">
        <source src="audio/kakaist-camera-shutter-314056.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
      </audio>
      <form class="contact-form">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" required>

        <div style="display: flex; align-items: center; justify-content: center; gap: 4px; margin: 12px 0;">
          <label><input type="checkbox" name="services" value="sports-game"> Sports game</label>
          <button type="submit">Send Message</button>
          <label style="margin-left: 12px;"><input type="checkbox" name="services" value="photoshoot"> Photoshoot</label>
        </div>
      </form>
    </div>
    <svg class="camera-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="position: fixed; bottom: 20px; right: 20px; width: 100px; height: auto; z-index: 9999; cursor: pointer; filter: drop-shadow(0 6px 16px rgba(0,0,0,0.6));">
      
      <rect x="15" y="25" width="70" height="50" rx="5" fill="#4ea1ff" stroke="#ffffff" stroke-width="2"/>
      
      <circle cx="50" cy="50" r="18" fill="#ffffff" stroke="#4ea1ff" stroke-width="2"/>
      
      <circle cx="50" cy="50" r="12" fill="#000000" opacity="0.3"/>
      
      <rect x="25" y="15" width="12" height="8" rx="1" fill="#ffffff" stroke="#4ea1ff" stroke-width="1"/>
    </svg>
  </body>
</html>
